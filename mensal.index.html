<div class="quality-rating">
    <h2>Quality Rating</h2>
    <ul>
        <li>
            <span>Giselle: </span>
            <input type="number" min="0" max="10" value="0" />
        </li>
        <li>
            <span>Francisco: </span>
            <input type="number" min="0" max="10" value="0" />
        </li>
        <li>
            <span>Joice: </span>
            <input type="number" min="0" max="10" value="0" />
        </li>
        <li>
            <span>João: </span>
            <input type="number" min="0" max="10" value="0" />
        </li>
        <li>
            <span>Vinicius: </span>
            <input type="number" min="0" max="10" value="0" />
        </li>
        <li>
            <span>Lucas: </span>
            <input type="number" min="0" max="10" value="0" />
        </li>
    </ul>
    <button id="save-scores">Save Scores</button>
</div>
<script>
    document.getElementById('save-scores').onclick = function() {
        const scores = [];
        const inputs = document.querySelectorAll('.quality-rating input');
        inputs.forEach(input => {
            scores.push({ agent: input.previousElementSibling.innerText, score: input.value });
        });
        console.log('Saved scores:', scores);
        alert('Scores saved successfully!');
    };
</script>
<style>
.quality-rating {
    background-color: #f9f9f9;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 5px;
}
.quality-rating h2 {
    font-size: 1.5em;
}
.quality-rating ul {
    list-style: none;
    padding: 0;
}
.quality-rating li {
    margin: 10px 0;
}
.quality-rating button {
    margin-top: 10px;
    padding: 5px 10px;
}
</style>
